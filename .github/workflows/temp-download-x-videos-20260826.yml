name: Temporary exact X video download

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Install yt-dlp
        shell: bash
        run: python -m pip install --upgrade yt-dlp

      - name: Download the two original X status videos separately
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output

          python -m yt_dlp \
            --no-playlist \
            --format "bestvideo*+bestaudio/best" \
            --merge-output-format mp4 \
            --output "output/santoulang-2092533979673178520.%(ext)s" \
            "https://x.com/santoulang/status/2092533979673178520/video/1?s=46"

          python -m yt_dlp \
            --no-playlist \
            --format "bestvideo*+bestaudio/best" \
            --merge-output-format mp4 \
            --output "output/santoulang-2092545724454142278.%(ext)s" \
            "https://x.com/santoulang/status/2092545724454142278/video/1?s=46"

          python - <<'PY'
          import glob
          import hashlib
          import json
          import pathlib

          expected = [
              pathlib.Path("output/santoulang-2092533979673178520.mp4"),
              pathlib.Path("output/santoulang-2092545724454142278.mp4"),
          ]
          missing = [str(path) for path in expected if not path.is_file()]
          if missing:
              raise SystemExit(f"Missing expected MP4 files: {missing}; found={glob.glob('output/*')}")

          details = []
          for path in expected:
              data = path.read_bytes()
              if b"ftyp" not in data[:64]:
                  raise SystemExit(f"Not a valid MP4 header: {path}")
              details.append({
                  "file": str(path),
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })

          print(json.dumps(details, indent=2))
          if details[0]["sha256"] == details[1]["sha256"]:
              raise SystemExit("The two downloaded files are identical; refusing to publish them")
          PY

      - name: Upload verified videos
        uses: actions/upload-artifact@v4
        with:
          name: x-videos-correct-${{ runner.os }}
          path: output/*.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
